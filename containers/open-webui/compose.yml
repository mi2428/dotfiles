---
services:
  # Source implementation: https://github.com/mi2428/sakura-ai-engine-gateway
  sakura-ai-engine-gateway:
    image: ghcr.io/mi2428/sakura-ai-engine-gateway:latest
    pull_policy: always
    environment:
      SAKURA_AI_ENGINE_ACCOUNT_TOKENS: "${SAKURA_AI_ENGINE_ACCOUNT_TOKENS:?set SAKURA_AI_ENGINE_ACCOUNT_TOKENS}"
      GATEWAY_CLIENT_TOKENS: "${GATEWAY_CLIENT_TOKENS:?set GATEWAY_CLIENT_TOKENS}"
      SAKURA_RETRY_MAX: "5"
      SAKURA_RETRY_BASE_INTERVAL: "10s"
      SAKURA_RETRY_JITTER: "1s"
      SAKURA_RETRY_MAX_INTERVAL: "120s"
      SAKURA_RETRY_BUDGET: "3200s"
      SAKURA_UPSTREAM_IDLE_TIMEOUT: "420s"
    ports:
      - "127.0.0.1:38081:8080"
    restart: unless-stopped

  sakura-ai-engine-searchtool:
    profiles: [webui]
    image: ghcr.io/mi2428/sakura-ai-engine-gateway:latest
    pull_policy: always
    command: ["/searchtool"]
    environment:
      SEARCHTOOL_LISTEN_ADDRESS: ":8081"
      SEARCHTOOL_CLIENT_TOKEN: "${SEARCHTOOL_CLIENT_TOKEN:?set SEARCHTOOL_CLIENT_TOKEN}"
      SEARCHTOOL_BRAVE_API_KEY: "${SEARCHTOOL_BRAVE_API_KEY:?set SEARCHTOOL_BRAVE_API_KEY}"
      SEARCHTOOL_TAVILY_API_KEY: "${SEARCHTOOL_TAVILY_API_KEY:?set SEARCHTOOL_TAVILY_API_KEY}"
      SEARCHTOOL_EXA_API_KEY: "${SEARCHTOOL_EXA_API_KEY:?set SEARCHTOOL_EXA_API_KEY}"
      SEARCHTOOL_FIRECRAWL_API_KEY: "${SEARCHTOOL_FIRECRAWL_API_KEY:?set SEARCHTOOL_FIRECRAWL_API_KEY}"
      SEARCHTOOL_PARALLEL_API_KEY: "${SEARCHTOOL_PARALLEL_API_KEY:?set SEARCHTOOL_PARALLEL_API_KEY}"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_reservation: 64m
    mem_limit: 256m
    restart: unless-stopped
