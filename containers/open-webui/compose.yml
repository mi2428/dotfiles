---
services:
  # Source implementation: https://github.com/mi2428/sakura-ai-engine-gateway
  sakura-ai-engine-gateway:
    image: ghcr.io/mi2428/sakura-ai-engine-gateway:latest
    pull_policy: always
    environment:
      SAKURA_AI_ENGINE_ACCOUNT_TOKENS: "${SAKURA_AI_ENGINE_ACCOUNT_TOKENS:?set SAKURA_AI_ENGINE_ACCOUNT_TOKENS}"
      GATEWAY_CLIENT_TOKENS: "${GATEWAY_CLIENT_TOKENS:?set GATEWAY_CLIENT_TOKENS}"
      SAKURA_RETRY_MAX: "5"
      SAKURA_RETRY_BASE_INTERVAL: "10s"
      SAKURA_RETRY_JITTER: "1s"
      SAKURA_RETRY_MAX_INTERVAL: "120s"
      SAKURA_RETRY_BUDGET: "3200s"
      SAKURA_UPSTREAM_IDLE_TIMEOUT: "420s"
    ports:
      - "127.0.0.1:38081:8080"
    restart: unless-stopped
