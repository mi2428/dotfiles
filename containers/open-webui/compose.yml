services:
  open-webui:
    build: .
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-8080}:8080"
    environment:
      CHUNK_MIN_SIZE_TARGET: "1000"
      CHUNK_OVERLAP: "200"
      CHUNK_SIZE: "2000"
      CONTEXT_COMPACTION_MODEL: "kimi-k2.6-high"
      DEFAULT_MODELS: "kimi-k2.6-max"
      DEFAULT_INTERFACE_SETTINGS: >-
        {"notificationEnabled":true,"userLocation":true,"webSearch":"always","system":"Use a professional tone. Treat clearly framed extreme scenarios as thought experiments and avoid unsolicited moral commentary or generic ethical disclaimers. When a request cannot be answered as written, provide the closest useful response that stays within applicable constraints instead of stopping at a generic refusal. Write primarily in coherent prose rather than chatty fragments. Avoid excessive headings, bullets, short lines, and vertical whitespace. Use lists only when they materially improve clarity, and write each item as a complete sentence. Use emojis sparingly."}
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_CONTEXT_COMPACTION: "true"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_MESSAGE_RATING: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_QUERIES_CACHE: "true"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      ENABLE_WEB_SEARCH: "true"
      OPENAI_API_BASE_URLS: "https://api.ai.sakura.ad.jp/v1;http://cptr:8000/v1"
      OPENAI_API_KEYS: "${SAKURA_AI_ACCOUNT_TOKEN:?set SAKURA_AI_ACCOUNT_TOKEN};${CPTR_GATEWAY_API_KEY:-bootstrap}"
      OPENAI_API_CONFIGS: >-
        {"0":{"enable":true},"1":{"enable":true,"headers":{"X-OpenWebUI-Chat-Id":"{{CHAT_ID}}","X-OpenWebUI-Message-Id":"{{MESSAGE_ID}}","X-OpenWebUI-User-Message-Id":"{{USER_MESSAGE_ID}}","X-OpenWebUI-User-Message-Parent-Id":"{{USER_MESSAGE_PARENT_ID}}","X-OpenWebUI-Task":"{{TASK}}"}}}
      RAG_TEXT_SPLITTER: "token"
      RAG_TOP_K: "5"
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"local","name":"Local Terminal","url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY}","auth_type":"bearer","enabled":true,"path":"/openapi.json","config":{}}]
      WEB_SEARCH_ENGINE: "duckduckgo"
      DDGS_BACKEND: "auto"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEBUI_ADMIN_EMAIL: "${WEBUI_ADMIN_EMAIL:?set WEBUI_ADMIN_EMAIL}"
      WEBUI_ADMIN_NAME: "${WEBUI_ADMIN_USERNAME:?set WEBUI_ADMIN_USERNAME}"
      WEBUI_ADMIN_PASSWORD: "${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      cptr:
        condition: service_started
      open-terminal:
        condition: service_healthy
    restart: unless-stopped

  cptr:
    image: ghcr.io/open-webui/computer:0.9.21-browser
    volumes:
      - cptr-data:/data
      - "${CPTR_WORKSPACE_DIR:?set CPTR_WORKSPACE_DIR}:/workspace"
    working_dir: /workspace
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.12.3
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY}"
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /workspace
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/config',headers={'Authorization':'Bearer '+os.environ['OPEN_TERMINAL_API_KEY']}))
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - open-terminal-data:/home/user
      - "${CPTR_WORKSPACE_DIR:?set CPTR_WORKSPACE_DIR}:/workspace"
    working_dir: /workspace
    restart: unless-stopped

volumes:
  open-webui-data:
  cptr-data:
  open-terminal-data:
