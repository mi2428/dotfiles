---
services:
  open-webui:
    build: .
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-38080}:8080"
    environment:
      AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER: "7200"
      CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS: "300"
      CHUNK_MIN_SIZE_TARGET: "1000"
      CHUNK_OVERLAP: "200"
      CHUNK_SIZE: "2000"
      CONTEXT_COMPACTION_MODEL: "sacloud.preview/gemma-4-31B-it"
      CONTEXT_COMPACTION_PROMPT_TEMPLATE: >-
        あなたは長時間の調査を継続するための状態要約を作成する。
        圧縮対象から、ユーザーの目的と制約、確認済みの事実と出典URL、重要な推論と判断、失敗した方法、未解決事項、後続作業に必要なツール結果を日本語で保存する。
        事実・推論・不明点を区別し、情報を創作しない。最近のメッセージと重複する細部は省くが、数値、固有名詞、日付、決定理由は失わない。
        圧縮対象: {{COMPACTED_MESSAGES}}
        最近のメッセージ: {{RECENT_MESSAGES}}
      CONTEXT_COMPACTION_TOKEN_CAP: "200000"
      CONTEXT_COMPACTION_TOKEN_THRESHOLD: "80000"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:?set CORS_ALLOW_ORIGIN}"
      DEFAULT_INTERFACE_SETTINGS: >-
        {"notificationEnabled": true,
        "userLocation": true,
        "features": {"web_search": true, "code_interpreter": true},
        "webSearch": "always",
        "widescreenMode": true}
      DEFAULT_MODEL_METADATA: >-
        {"capabilities": {"web_search": true, "code_interpreter": true},
        "defaultFeatureIds": ["web_search", "code_interpreter"]}
      DEFAULT_MODELS: "sacloud.kimi-k2.6-high"
      DEFAULT_PINNED_MODELS: "sacloud.kimi-k2.6-low,sacloud.kimi-k2.6-high,sacloud.kimi-k2.6-max,sacloud.kimi-k2.7-deep-research"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_CONTEXT_COMPACTION: "true"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_MESSAGE_RATING: "false"
      ENABLE_NOTES: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_QUERIES_CACHE: "true"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      ENABLE_SUBAGENTS: "true"
      ENABLE_WEB_SEARCH: "true"
      OPENAI_API_BASE_URLS: >-
        http://sakura-proxy:8080/v1;http://cptr:8000/v1
      OPENAI_API_CONFIGS: >-
        {
          "0": {
            "enable": true,
            "headers": {"X-OpenWebUI-Mode": "true"},
            "prefix_id": "sacloud",
            "provider": "llama.cpp",
            "tags": [{"name": "Sakura"}]
          },
          "1": {
            "enable": true,
            "headers": {
              "X-OpenWebUI-Chat-Id": "{{CHAT_ID}}",
              "X-OpenWebUI-Message-Id": "{{MESSAGE_ID}}",
              "X-OpenWebUI-User-Message-Id": "{{USER_MESSAGE_ID}}",
              "X-OpenWebUI-User-Message-Parent-Id":
                "{{USER_MESSAGE_PARENT_ID}}",
              "X-OpenWebUI-Task": "{{TASK}}"
            }
          }
        }
      OPENAI_API_KEYS: "sakura-proxy;${CPTR_GATEWAY_API_KEY:-bootstrap}"
      RAG_TEXT_SPLITTER: "token"
      RAG_TOP_K: "5"
      DEEP_RESEARCH_RUNTIME_API_KEY: >-
        ${DEEP_RESEARCH_RUNTIME_API_KEY:?set DEEP_RESEARCH_RUNTIME_API_KEY}
      SEARXNG_LANGUAGE: "all"
      SEARXNG_QUERY_URL: "http://searxng:8080/search"
      SUBAGENTS_BACKGROUND_ENABLED: "false"
      SUBAGENTS_MAX_CONCURRENT: "4"
      SUBAGENTS_MAX_ITERATIONS: "300"
      SUBAGENTS_MAX_OUTPUT: "16000"
      SUBAGENTS_SYSTEM_PROMPT: >-
        あなたは親エージェントから割り当てられた独立調査を担当する。
        利用可能なツールで一次資料を優先して検証し、自然な日本語で、結論、根拠と出典URL、反証または不確実性、親が次に確認すべき点を簡潔に返す。
        割当範囲を越えて最終回答全体を作らない。
      TASK_MODEL_EXTERNAL: "sacloud.preview/gemma-4-31B-it"
      TASK_MODEL_PARAMS: '{"max_tokens": 4096}'
      TERMINAL_SERVER_CONNECTIONS: >-
        [
          {
            "id": "local",
            "name": "Local Terminal",
            "url": "http://open-terminal:8000",
            "key": "${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY}",
            "auth_type": "bearer",
            "enabled": true,
            "path": "/openapi.json",
            "config": {}
          }
        ]
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: "10"
      WEBUI_ADMIN_EMAIL: "${WEBUI_ADMIN_EMAIL:?set WEBUI_ADMIN_EMAIL}"
      WEBUI_ADMIN_NAME: >-
        ${WEBUI_ADMIN_USERNAME:?set WEBUI_ADMIN_USERNAME}
      WEBUI_ADMIN_PASSWORD: >-
        ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_USERNAME: "${WEBUI_ADMIN_USERNAME:?set WEBUI_ADMIN_USERNAME}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}"
      WEBUI_URL: "${WEBUI_URL:?set WEBUI_URL}"
    volumes:
      - open-webui-data:/app/backend/data
      - ./assets/profile.webp:/app/backend/declarative/assets/profile.webp:ro
      - ./assets/sakura-ai-engine.png:/app/backend/declarative/assets/sakura-ai-engine.png:ro
      - ./assets/sakura-ai-engine-low.png:/app/backend/declarative/assets/sakura-ai-engine-low.png:ro
      - ./assets/sakura-ai-engine-medium.png:/app/backend/declarative/assets/sakura-ai-engine-medium.png:ro
      - ./assets/sakura-ai-engine-high.png:/app/backend/declarative/assets/sakura-ai-engine-high.png:ro
      - ./assets/sakura-ai-engine-max.png:/app/backend/declarative/assets/sakura-ai-engine-max.png:ro
      - ./config:/app/backend/declarative/config:ro
      - ./functions:/app/backend/declarative/functions:ro
      - ./scripts:/app/backend/declarative-scripts:ro
      - ./skills:/app/backend/declarative/skills:ro
    command: [bash, /app/backend/declarative-scripts/start.sh]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /app/backend/data/.declarative-ready &&
          curl --silent --fail http://127.0.0.1:8080/health |
          jq -e '.status == true' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    depends_on:
      cptr:
        condition: service_started
      open-terminal:
        condition: service_healthy
      deep-research-runtime:
        condition: service_healthy
      sakura-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped

  deep-research-runtime:
    build: ./deep_research_runtime
    cap_drop:
      - ALL
    environment:
      DEEP_RESEARCH_DB_PATH: /data/deep-research.sqlite3
      DEEP_RESEARCH_LLM_API_KEY: sakura-proxy
      DEEP_RESEARCH_LLM_BASE_URL: http://sakura-proxy:8080/v1
      DEEP_RESEARCH_RUNTIME_API_KEY: >-
        ${DEEP_RESEARCH_RUNTIME_API_KEY:?set DEEP_RESEARCH_RUNTIME_API_KEY}
      DEEP_RESEARCH_MODEL: preview/Kimi-K2.7-Code
      DEEP_RESEARCH_KIMI_TIMEOUT_SECONDS: "1800"
      DEEP_RESEARCH_WALL_QUICK_SECONDS: "1800"
      DEEP_RESEARCH_WALL_STANDARD_SECONDS: "5400"
      DEEP_RESEARCH_WALL_DEEP_SECONDS: "6900"
      DEEP_RESEARCH_SEARCH_BUDGET_QUICK: "8"
      DEEP_RESEARCH_SEARCH_BUDGET_STANDARD: "24"
      DEEP_RESEARCH_SEARCH_BUDGET_DEEP: "64"
      DEEP_RESEARCH_EVIDENCE_BUDGET_QUICK: "10"
      DEEP_RESEARCH_EVIDENCE_BUDGET_STANDARD: "28"
      DEEP_RESEARCH_EVIDENCE_BUDGET_DEEP: "40"
      DEEP_RESEARCH_MIN_EVIDENCE_QUICK: "2"
      DEEP_RESEARCH_MIN_EVIDENCE_STANDARD: "4"
      DEEP_RESEARCH_MIN_EVIDENCE_DEEP: "20"
      DEEP_RESEARCH_MODEL_TURNS_QUICK: "20"
      DEEP_RESEARCH_MODEL_TURNS_STANDARD: "40"
      DEEP_RESEARCH_MODEL_TURNS_DEEP: "180"
      SEARXNG_URL: http://searxng:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      sakura-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - deep-research-runtime-data:/data
    restart: unless-stopped

  sakura-proxy:
    build: ./sakura_proxy
    environment:
      SAKURA_AI_ACCOUNT_TOKENS: "${SAKURA_AI_ACCOUNT_TOKENS:?set SAKURA_AI_ACCOUNT_TOKENS}"
      SAKURA_RETRY_BASE_SECONDS: "2"
      SAKURA_RETRY_JITTER_SECONDS: "1"
      SAKURA_RETRY_MAX: "10"
      SAKURA_RETRY_MAX_SECONDS: "120"
      SAKURA_RETRY_BUDGET_SECONDS: "1200"
      SAKURA_UPSTREAM_TIMEOUT_SECONDS: "420"
      SAKURA_UPSTREAM_URL: "https://api.ai.sakura.ad.jp"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ddg-proxy:
    build: ./ddg_proxy
    cap_drop:
      - ALL
    environment:
      DDG_IMPERSONATE: "chrome_151"
      DDG_IMPERSONATE_OS: "macos"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/health')
      interval: 5s
      timeout: 5s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cptr:
    image: ghcr.io/open-webui/computer:0.9.21-browser@sha256:bbcf59b541dba201ca91084a1f7857ca617b94aa0f770b0fd2dd279e2e56a7ce
    volumes:
      - cptr-data:/data
      - ./scripts/bootstrap_cptr.py:/usr/local/libexec/bootstrap_cptr.py:ro
      - "${CPTR_WORKSPACE_DIR:?set CPTR_WORKSPACE_DIR}:/workspace"
    working_dir: /workspace
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.12.3@sha256:8f6d2045aa69e348e39d89bf59e6b267773532335333eed14ff16bbc7c964b73
    environment:
      OPEN_TERMINAL_API_KEY: >-
        ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY}
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /workspace
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          urllib.request.Request('http://127.0.0.1:8000/api/config',
          headers={'Authorization': 'Bearer '
          + os.environ['OPEN_TERMINAL_API_KEY']}))
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - open-terminal-data:/home/user
      - "${CPTR_WORKSPACE_DIR:?set CPTR_WORKSPACE_DIR}:/workspace"
    working_dir: /workspace
    restart: unless-stopped

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.29-d226b78bc@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET}"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      ddg-proxy:
        condition: service_healthy
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    restart: unless-stopped

volumes:
  open-webui-data:
  cptr-data:
  open-terminal-data:
  deep-research-runtime-data:
  searxng-data:
