[project]
name = "open-webui-research-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pypdf>=5,<6",
  "strands-agents[openai]>=1.54,<1.55",
  "trafilatura>=2,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pyright>=1.1.411,<2",
  "ruff>=0.16.4,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."
