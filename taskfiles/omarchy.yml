version: '3'

tasks:
  omarchy.copy:
    desc: Copy MBP and Ghostty presets into writable files, backing up existing settings
    cmds:
      - bash '{{.REPO_ROOT}}/scripts/copy-omarchy-presets.sh'

  omarchy.test:
    desc: Run offline Omarchy integration regression checks
    cmds:
      - bash '{{.REPO_ROOT}}/scripts/test-omarchy-presets.sh'
      - bash '{{.REPO_ROOT}}/scripts/test-omarchy-resolution.sh'
      - bash '{{.REPO_ROOT}}/scripts/test-omarchy-awake.sh'
      - bash '{{.REPO_ROOT}}/scripts/test-pacman-sync.sh'
      - python3 '{{.REPO_ROOT}}/scripts/test-fonts.py'
