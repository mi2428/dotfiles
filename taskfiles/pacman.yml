version: '3'

tasks:
  pacman.sync:
    desc: Update Arch packages and install the repo-managed package lists
    preconditions:
      - sh: 'test "$(uname -s)" = Linux && command -v pacman >/dev/null && grep -Eq "^(ID|ID_LIKE)=.*arch" /etc/os-release'
        msg: pacman.sync requires Arch Linux or an Arch-based distribution
    cmds:
      - |
        set -eu
        repo_root='{{.REPO_ROOT}}'
        set -- "$repo_root/packages/pacman.txt"
        repos=$(pacman-conf --repo-list)
        if printf '%s\n' "$repos" | grep -qx omarchy; then
          set -- "$@" "$repo_root/packages/omarchy.txt"
        fi
        # No package removal, AUR builds, service activation, or mise config changes.
        packages=$(cat "$@")
        printf '%s\n' "$packages" | sudo pacman -Syu --needed -
        # Prime Omarchy's lazy tools in dependency order instead of relying on shims.
        if printf '%s\n' "$repos" | grep -qx omarchy; then
          mise install node
          mise install opencode
        fi

  aur.sync:
    desc: Build and install the repo-managed AUR packages with interactive review
    preconditions:
      - sh: 'test "$(uname -s)" = Linux && command -v yay >/dev/null && grep -Eq "^(ID|ID_LIKE)=.*arch" /etc/os-release'
        msg: aur.sync requires Arch Linux and yay; run pacman.sync first
    cmds:
      - |
        set -eu
        # Keep yay's PKGBUILD review and confirmation prompts enabled.
        # Rust builds require an initialized rustup toolchain.
        xargs -r -o yay -S --needed -- < '{{.REPO_ROOT}}/packages/aur.txt'
