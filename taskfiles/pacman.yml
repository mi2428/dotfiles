version: '3'

tasks:
  pacman.sync:
    desc: Update and install repository and AUR packages with interactive review
    preconditions:
      - sh: 'test "$(uname -s)" = Linux && command -v pacman >/dev/null && command -v yay >/dev/null && grep -Eq "^(ID|ID_LIKE)=.*arch" /etc/os-release'
        msg: pacman.sync requires Arch Linux or an Arch-based distribution and yay
    cmds:
      - |
        set -eu
        repo_root='{{.REPO_ROOT}}'
        set -- "$repo_root/packages/pacman.txt"
        repos=$(pacman-conf --repo-list)
        if printf '%s\n' "$repos" | grep -qx omarchy; then
          set -- "$@" "$repo_root/packages/omarchy.txt"
        fi
        # Keep yay's PKGBUILD review and confirmation prompts on the terminal.
        # Rust AUR builds require an initialized rustup toolchain.
        packages=$(cat "$@" "$repo_root/packages/aur.txt")
        printf '%s\n' "$packages" | sort -u | xargs -r -o yay -Syu --needed --
        # Prime Omarchy's lazy tools in dependency order instead of relying on shims.
        if printf '%s\n' "$repos" | grep -qx omarchy; then
          mise install node
          mise install opencode
        fi
