version: '3'

tasks:
  docker.build:
    desc: Build Dockerfile locally as ghcr.io/OWNER/IMAGE:TAG
    preconditions:
      - sh: 'command -v {{default "docker" .DOCKER_RUNTIME}} >/dev/null 2>&1'
        msg: DOCKER_RUNTIME was not found in PATH
    cmds:
      - |
        set -eu
        docker_runtime='{{default "docker" .DOCKER_RUNTIME}}'
        ghcr_owner='{{default "mi2428" .GHCR_OWNER}}'
        ghcr_image_name='{{default "dotfiles" .GHCR_IMAGE_NAME}}'
        tag='{{default "latest" .TAG}}'
        platform='{{default "linux/arm64" .PLATFORM}}'
        ghcr_image="ghcr.io/$ghcr_owner/$ghcr_image_name"
        "$docker_runtime" buildx build --platform "$platform" --load -t "$ghcr_image:$tag" .

  docker.login:
    desc: Login to ghcr.io with GHCR_TOKEN, GITHUB_TOKEN, or gh auth token
    preconditions:
      - sh: 'command -v {{default "docker" .DOCKER_RUNTIME}} >/dev/null 2>&1'
        msg: DOCKER_RUNTIME was not found in PATH
      - sh: '[ -n "${GHCR_TOKEN:-}" ] || [ -n "${GITHUB_TOKEN:-}" ] || command -v gh >/dev/null 2>&1'
        msg: Set GHCR_TOKEN, GITHUB_TOKEN, or authenticate with gh before logging in to ghcr.io
    cmds:
      - |
        set -eu
        docker_runtime='{{default "docker" .DOCKER_RUNTIME}}'
        ghcr_owner='{{default "mi2428" .GHCR_OWNER}}'
        if [ -n "${GHCR_TOKEN:-}" ]; then
          token="$(printf %s "${GHCR_TOKEN}")"
        elif [ -n "${GITHUB_TOKEN:-}" ]; then
          token="$(printf %s "${GITHUB_TOKEN}")"
        else
          token="$(gh auth token)"
        fi
        username="${GHCR_USERNAME:-$ghcr_owner}"
        printf '%s' "$token" | "$docker_runtime" login ghcr.io -u "$username" --password-stdin

  docker.push:
    desc: Build and push the dotfiles and Open WebUI images to ghcr.io
    preconditions:
      - sh: 'command -v {{default "docker" .DOCKER_RUNTIME}} >/dev/null 2>&1'
        msg: DOCKER_RUNTIME was not found in PATH
    cmds:
      - task: docker.login
        vars:
          DOCKER_RUNTIME: '{{default "docker" .DOCKER_RUNTIME}}'
          GHCR_OWNER: '{{default "mi2428" .GHCR_OWNER}}'
      - |
        set -eu
        docker_runtime='{{default "docker" .DOCKER_RUNTIME}}'
        ghcr_owner='{{default "mi2428" .GHCR_OWNER}}'
        tag='{{default "latest" .TAG}}'
        platform='{{default "linux/arm64" .PLATFORM}}'
        for spec in 'dotfiles:.' 'open-webui:containers/open-webui'; do
          ghcr_image_name="${spec%%:*}"
          build_context="${spec#*:}"
          ghcr_image="ghcr.io/$ghcr_owner/$ghcr_image_name"
          "$docker_runtime" buildx build --platform "$platform" --push -t "$ghcr_image:$tag" "$build_context"
        done

  docker.run:
    desc: Run the MCP workspace container on 127.0.0.1:3000
    preconditions:
      - sh: 'command -v {{default "docker" .DOCKER_RUNTIME}} >/dev/null 2>&1'
        msg: DOCKER_RUNTIME was not found in PATH
    cmds:
      - |
        set -eu
        docker_runtime='{{default "docker" .DOCKER_RUNTIME}}'
        ghcr_owner='{{default "mi2428" .GHCR_OWNER}}'
        ghcr_image_name='{{default "dotfiles" .GHCR_IMAGE_NAME}}'
        tag='{{default "latest" .TAG}}'
        port='{{default "3000" .PORT}}'
        workspace='{{default .REPO_ROOT .WORKSPACE_DIR}}'
        container_name='{{default "dotfiles-mcp" .CONTAINER_NAME}}'
        host_user="${USER:-teo}"
        host_uid="$(id -u)"
        host_gid="$(id -g)"
        if [ ! -d "$workspace" ]; then
          echo "workspace does not exist: $workspace" >&2
          exit 1
        fi
        if [ -n "${GH_TOKEN:-}" ]; then
          gh_token="$GH_TOKEN"
        elif command -v gh >/dev/null 2>&1; then
          gh_token="$(gh auth token 2>/dev/null || true)"
        else
          gh_token=""
        fi
        image="ghcr.io/$ghcr_owner/$ghcr_image_name:$tag"
        if "$docker_runtime" inspect -f '{{.State.Running}}' "$container_name" >/dev/null 2>&1; then
          if [ "$($docker_runtime inspect -f '{{.State.Running}}' "$container_name")" != true ]; then
            "$docker_runtime" start "$container_name" >/dev/null
          fi
        else
          if [ -n "$gh_token" ]; then
            export GH_TOKEN="$gh_token"
            "$docker_runtime" run -d --init --rm --name "$container_name" -p "127.0.0.1:${port}:3000" -v "$workspace:/work" -e "HOST_USER=$host_user" -e "HOST_UID=$host_uid" -e "HOST_GID=$host_gid" -e GH_TOKEN "$image"
          else
            "$docker_runtime" run -d --init --rm --name "$container_name" -p "127.0.0.1:${port}:3000" -v "$workspace:/work" -e "HOST_USER=$host_user" -e "HOST_UID=$host_uid" -e "HOST_GID=$host_gid" "$image"
          fi
        fi
