version: '3'

tasks:
  ai.check:
    desc: Check AI executables and OpenCode/Herdr profiles
    cmds:
      - '{{.REPO_ROOT}}/scripts/test-herdr-env.sh'
      - 'node {{.REPO_ROOT}}/scripts/test-oc2-herdr-fixture.mjs'
      - '{{.REPO_ROOT}}/scripts/check-ai-stack.sh'

  ai.upgrade:
    desc: Upgrade external AI harnesses and OpenCode, then refresh the exact Slim pin; apply Home Manager separately
    cmds:
      - |
        set -eu
        brew_bin="$(command -v brew)"
        if ! installed_formulas=$("$brew_bin" list --formula --versions); then
          printf '%s\n' 'AI stack upgrade: could not inspect installed Homebrew formulas' >&2
          exit 1
        fi
        if printf '%s\n' "$installed_formulas" | grep -Eq '(^|/|[[:space:]])opencode([[:space:]]|$)'; then
          printf '%s\n' 'AI stack upgrade: an opencode formula conflicts with anomalyco/tap/opencode-v2; remove the V1/core formula intentionally, then retry.' >&2
          exit 1
        fi
        "$brew_bin" update
        if "$brew_bin" list --formula anomalyco/tap/opencode-v2 >/dev/null 2>&1; then
          "$brew_bin" upgrade anomalyco/tap/opencode-v2
        else
          "$brew_bin" install anomalyco/tap/opencode-v2
        fi
        "$brew_bin" upgrade --cask codex claude-code
      - '{{.REPO_ROOT}}/scripts/update-ai-stack.sh ''{{default "" .SLIM_VERSION}}'''
      - 'printf "%s\n" "AI plugin pins updated; run task hm.switch, then task ai.check."'

  ai.webui.check:
    desc: Run local Open WebUI tests and static configuration checks
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v base64 >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1 && command -v uv >/dev/null 2>&1 && command -v ruff >/dev/null 2>&1 && command -v shellcheck >/dev/null 2>&1
        msg: Docker Compose, base64, jq, Python, uv, Ruff, and ShellCheck are required
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 uv run --no-project --with pillow==12.3.0 python -m unittest discover -s '{{.REPO_ROOT}}/containers/open-webui/scripts' -p 'test_*.py'
      - PYTHONDONTWRITEBYTECODE=1 uv run --no-project --with ddgs==9.16.0 python -m unittest discover -s '{{.REPO_ROOT}}/containers/open-webui/searchtool_proxy' -p 'test_*.py'
      - ruff format --check '{{.REPO_ROOT}}/containers/open-webui'
      - ruff check '{{.REPO_ROOT}}/containers/open-webui'
      - uv run --no-project --with ddgs==9.16.0 --with pillow==12.3.0 --with pyright pyright '{{.REPO_ROOT}}/containers/open-webui'
      - shellcheck '{{.REPO_ROOT}}/containers/open-webui/scripts/reconcile.sh' '{{.REPO_ROOT}}/containers/open-webui/scripts/start.sh' '{{.REPO_ROOT}}/scripts/bootstrap-cptr.sh' '{{.REPO_ROOT}}/scripts/open-webui.sh'
      - |
        export \
          CORS_ALLOW_ORIGIN=http://localhost \
          CPTR_WORKSPACE_DIR='{{.REPO_ROOT}}' \
          OPEN_TERMINAL_API_KEY=dummy \
          SAKURA_AI_ENGINE_ACCOUNT_TOKENS='["dummy-account"]' \
          GATEWAY_CLIENT_TOKENS='{"open-webui":"01234567890123456789012345678901"}' \
          SEARCHTOOL_CLIENT_TOKEN='01234567890123456789012345678901' \
          SEARCHTOOL_BRAVE_API_KEY=dummy \
          SEARCHTOOL_TAVILY_API_KEY=dummy \
          SEARCHTOOL_EXA_API_KEY=dummy \
          SEARCHTOOL_FIRECRAWL_API_KEY=dummy \
          SEARCHTOOL_PARALLEL_API_KEY=dummy \
          SAKURA_PROXY_CLIENT_TOKEN=dummy \
          WEBUI_ADMIN_EMAIL=admin@example.invalid \
          WEBUI_ADMIN_PASSWORD=dummy \
          WEBUI_ADMIN_USERNAME=admin \
          WEBUI_SECRET_KEY=dummy \
          WEBUI_URL=http://localhost
        python3 -c '
        import subprocess

        base = [
            "docker",
            "compose",
            "-f",
            "{{.REPO_ROOT}}/containers/open-webui/compose.yml",
        ]
        full = [
            *base,
            "-f",
            "{{.REPO_ROOT}}/containers/open-webui/compose.webui.yml",
            "--profile",
            "webui",
        ]
        base_services = subprocess.check_output(
            [*base, "config", "--services"], text=True
        ).splitlines()
        assert base_services == ["sakura-ai-engine-gateway"], base_services
        expected = {
            "sakura-ai-engine-gateway",
            "sakura-ai-engine-searchtool",
            "searchtool",
            "open-webui",
            "cptr",
            "open-terminal",
        }
        services = set(
            subprocess.check_output(
                [*full, "config", "--services"], text=True
            ).splitlines()
        )
        assert services == expected, services
        subprocess.run([*full, "config", "--quiet"], check=True)
        '

  ai.webui.up:
    desc: Start Open WebUI and its local AI services with Docker
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v base64 >/dev/null 2>&1 && command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 && command -v nix >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1 && command -v rg >/dev/null 2>&1
        msg: Docker Compose, base64, curl, jq, Nix, Python, and rg are required
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' up'

  ai.webui.down:
    desc: Stop Open WebUI and its local development services
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v nix >/dev/null 2>&1
        msg: Docker Compose and Nix are required
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' down'

  ai.webui.logs:
    desc: Follow Open WebUI service logs
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v nix >/dev/null 2>&1
        msg: Docker Compose and Nix are required
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' logs'
