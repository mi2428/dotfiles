version: '3'

tasks:
  ai.check:
    desc: Check AI harness versions, Herdr integrations, and pinned OpenCode config
    cmds:
      - '{{.REPO_ROOT}}/scripts/check-ai-stack.sh'

  ai.upgrade:
    desc: Upgrade AI harnesses and refresh the exact OmO and Slim plugin pins
    cmds:
      - |
        set -eu
        brew_bin="$(command -v brew)"
        "$brew_bin" update
        "$brew_bin" upgrade herdr anomalyco/tap/opencode
        "$brew_bin" upgrade --cask codex claude-code
        for target in claude codex opencode; do
          herdr integration install "$target" >/dev/null
        done
      - '{{.REPO_ROOT}}/scripts/update-ai-stack.sh ''{{default "" .OMO_VERSION}}'' ''{{default "" .SLIM_VERSION}}'''
      - task: ai.check

  ai.webui.up:
    desc: Start Open WebUI, Computer, and Open Terminal with Docker
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v base64 >/dev/null 2>&1 && command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 && command -v nix >/dev/null 2>&1 && command -v rg >/dev/null 2>&1
        msg: Docker Compose, base64, curl, jq, Nix, and rg are required
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' up'

  ai.webui.down:
    desc: Stop Open WebUI, Computer, and Open Terminal without deleting their data
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v nix >/dev/null 2>&1
        msg: Docker Compose and Nix are required
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' down'

  ai.webui.logs:
    desc: Follow Open WebUI, Computer, and Open Terminal logs
    preconditions:
      - sh: command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 && command -v nix >/dev/null 2>&1
        msg: Docker Compose and Nix are required
    cmds:
      - '{{.REPO_ROOT}}/scripts/open-webui.sh ''{{.REPO_ROOT}}'' logs'
