version: '3'

tasks:
  ai.check:
    desc: Check AI harness versions, Herdr integrations, and pinned OpenCode config
    cmds:
      - '{{.REPO_ROOT}}/scripts/check-ai-stack.sh'

  ai.upgrade:
    desc: Upgrade AI harnesses and refresh the exact OmO and Slim plugin pins
    cmds:
      - |
        set -eu
        brew_bin="$(command -v brew)"
        "$brew_bin" update
        "$brew_bin" upgrade herdr anomalyco/tap/opencode
        "$brew_bin" upgrade --cask codex claude-code
        for target in claude codex opencode; do
          herdr integration install "$target" >/dev/null
        done
      - '{{.REPO_ROOT}}/scripts/update-ai-stack.sh ''{{default "" .OMO_VERSION}}'' ''{{default "" .SLIM_VERSION}}'''
      - task: ai.check
