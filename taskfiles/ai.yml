version: '3'

tasks:
  ai.check:
    desc: Check AI harness versions, Herdr integrations, and pinned OpenCode config
    cmds:
      - '{{.REPO_ROOT}}/scripts/check-ai-stack.sh'

  ai.upgrade:
    desc: Upgrade AI harnesses and refresh the exact OmO and Slim plugin pins
    cmds:
      - |
        set -eu
        brew_bin="$(command -v brew)"
        "$brew_bin" update
        "$brew_bin" upgrade herdr anomalyco/tap/opencode
        "$brew_bin" upgrade --cask codex claude-code
        for target in claude codex opencode; do
          herdr integration install "$target" >/dev/null
        done
      - '{{.REPO_ROOT}}/scripts/update-ai-stack.sh ''{{default "" .OMO_VERSION}}'' ''{{default "" .SLIM_VERSION}}'''
      - task: ai.check

  ai.ui.up:
    desc: Start Open WebUI and cptr with Podman
    preconditions:
      - sh: command -v podman >/dev/null 2>&1 && command -v podman-compose >/dev/null 2>&1
        msg: podman and podman-compose are required
      - sh: test -f '{{.REPO_ROOT}}/containers/open-webui/.env'
        msg: Copy containers/open-webui/.env.example to .env and set its secrets
      - sh: '! rg -q ''=(replace-me)?$'' ''{{.REPO_ROOT}}/containers/open-webui/.env'''
        msg: Set every required value in containers/open-webui/.env
      - sh: set -a; . '{{.REPO_ROOT}}/containers/open-webui/.env'; test -d "$CPTR_WORKSPACE_DIR"
        msg: CPTR_WORKSPACE_DIR must be an existing directory
    cmds:
      - |
        set -eu
        if [ "$(uname -s)" = Darwin ]; then
          podman machine inspect >/dev/null 2>&1 || podman machine init
          podman info >/dev/null 2>&1 || podman machine start
        fi
        podman-compose --env-file '{{.REPO_ROOT}}/containers/open-webui/.env' -f '{{.REPO_ROOT}}/containers/open-webui/compose.yml' up -d

  ai.ui.down:
    desc: Stop Open WebUI and cptr without deleting their data
    preconditions:
      - sh: command -v podman-compose >/dev/null 2>&1
        msg: podman-compose is required
      - sh: test -f '{{.REPO_ROOT}}/containers/open-webui/.env'
        msg: containers/open-webui/.env is missing
    cmds:
      - podman-compose --env-file '{{.REPO_ROOT}}/containers/open-webui/.env' -f '{{.REPO_ROOT}}/containers/open-webui/compose.yml' down

  ai.ui.logs:
    desc: Follow Open WebUI and cptr logs
    preconditions:
      - sh: command -v podman-compose >/dev/null 2>&1
        msg: podman-compose is required
      - sh: test -f '{{.REPO_ROOT}}/containers/open-webui/.env'
        msg: containers/open-webui/.env is missing
    cmds:
      - podman-compose --env-file '{{.REPO_ROOT}}/containers/open-webui/.env' -f '{{.REPO_ROOT}}/containers/open-webui/compose.yml' logs -f
