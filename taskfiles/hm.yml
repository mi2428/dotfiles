version: '3'

tasks:
  hm.update:
    desc: Update nixpkgs in flake.lock and apply the current host activation
    cmds:
      - |
        set -eu
        repo_root='{{.REPO_ROOT}}'
        "$repo_root/bootstrap/clean-repo-runtime-files.sh"
        stage_repo="$("$repo_root/bootstrap/stage-flake-source.sh")"
        trap 'rm -rf "$stage_repo"' EXIT
        nix_bin="$("$repo_root/bootstrap/install-nix.sh")"
        nix_bin_dir="$(dirname "$nix_bin")"

        PATH="$nix_bin_dir:$PATH" \
          "$nix_bin" flake update \
            --extra-experimental-features 'nix-command flakes' \
            nixpkgs \
            --flake "path:${stage_repo}"

        cp "$stage_repo/flake.lock" "$repo_root/flake.lock"
      - task: hm.switch
        vars:
          HOST: '{{.HOST}}'

  hm.build:
    desc: Build the current host activation without switching
    cmds:
      - |
        set -eu
        repo_root='{{.REPO_ROOT}}'
        "$repo_root/bootstrap/clean-repo-runtime-files.sh"
        stage_repo="$("$repo_root/bootstrap/stage-flake-source.sh")"
        trap 'rm -rf "$stage_repo"' EXIT
        host="$("$repo_root/bootstrap/resolve-host.sh" '{{default "" .HOST}}')"
        nix_bin="$("$repo_root/bootstrap/install-nix.sh")"
        nix_bin_dir="$(dirname "$nix_bin")"
        runtime_user="$(id -un)"
        runtime_home="${HOME:?task hm.build: HOME must be set}"
        runtime_system="$("$repo_root/bootstrap/detect-system.sh")"

        case "$(uname -s):$host" in
          Darwin:macos)
            target="path:${stage_repo}#darwinConfigurations.${host}.system"
            ;;
          Linux:linux|Linux:docker)
            target="path:${stage_repo}#homeConfigurations.${host}.activationPackage"
            ;;
          Darwin:*)
            printf '%s\n' "task hm.build: unsupported macOS host: $host" >&2
            exit 1
            ;;
          Linux:*)
            printf '%s\n' "task hm.build: unsupported Linux host: $host" >&2
            exit 1
            ;;
          *)
            printf '%s\n' "task hm.build: unsupported platform: $(uname -s)" >&2
            exit 1
            ;;
        esac

        PATH="$nix_bin_dir:$PATH" \
          DOTFILES_RUNTIME_USER="$runtime_user" \
          DOTFILES_RUNTIME_HOME="$runtime_home" \
          DOTFILES_RUNTIME_SYSTEM="$runtime_system" \
          "$nix_bin" build \
            --impure \
            --extra-experimental-features 'nix-command flakes' \
            --no-link \
            "$target"

  hm.switch:
    desc: Apply the current host activation and refresh Home Manager symlinks
    cmds:
      - |
        set -eu
        repo_root='{{.REPO_ROOT}}'
        "$repo_root/bootstrap/clean-repo-runtime-files.sh"
        host="$("$repo_root/bootstrap/resolve-host.sh" '{{default "" .HOST}}')"

        case "$(uname -s):$host" in
          Darwin:macos)
            exec "$repo_root/bootstrap/apply-darwin.sh" --host "$host"
            ;;
          Linux:linux|Linux:docker)
            exec "$repo_root/bootstrap/apply-home-manager.sh" --host "$host"
            ;;
          Darwin:*)
            printf '%s\n' "task hm.switch: unsupported macOS host: $host" >&2
            exit 1
            ;;
          Linux:*)
            printf '%s\n' "task hm.switch: unsupported Linux host: $host" >&2
            exit 1
            ;;
          *)
            printf '%s\n' "task hm.switch: unsupported platform: $(uname -s)" >&2
            exit 1
            ;;
        esac

  hm.link:
    desc: Re-apply the current host activation to re-create managed symlinks
    cmds:
      - task: hm.switch
        vars:
          HOST: '{{.HOST}}'

  hm.gc:
    desc: Delete old generations and collect Nix garbage (run without sudo)
    cmds:
      - |
        set -eu
        if [ "$(id -u)" -eq 0 ]; then
          printf '%s\n' 'task hm.gc: run task hm.gc as your login user, not with sudo; the task elevates only the system GC pass.' >&2
          exit 2
        fi

        repo_root='{{.REPO_ROOT}}'
        nix_bin="$("$repo_root/bootstrap/install-nix.sh")"
        nix_bin_dir="$(dirname "$nix_bin")"
        nix_collect_garbage_bin="$nix_bin_dir/nix-collect-garbage"

        if [ ! -x "$nix_collect_garbage_bin" ]; then
          nix_collect_garbage_bin="$(command -v nix-collect-garbage)"
        fi

        if [ "$(uname -s)" = "Darwin" ]; then
          sudo -H env PATH="$nix_bin_dir:$PATH" "$nix_collect_garbage_bin" -d
          PATH="$nix_bin_dir:$PATH" "$nix_collect_garbage_bin" -d
        else
          PATH="$nix_bin_dir:$PATH" "$nix_collect_garbage_bin" -d
        fi

        PATH="$nix_bin_dir:$PATH" \
          "$nix_bin" store optimise --extra-experimental-features 'nix-command flakes'

  hm.gc.repair-macl:
    desc: Remove macOS metadata that blocks GC for an unreferenced Nix store path
    cmds:
      - |
        set -eu
        if [ "$(id -u)" -eq 0 ]; then
          printf '%s\n' 'task hm.gc.repair-macl: run as your login user, not with sudo.' >&2
          exit 2
        fi

        if [ "$(uname -s)" != "Darwin" ]; then
          printf '%s\n' 'task hm.gc.repair-macl: this recovery task is only needed on macOS.' >&2
          exit 2
        fi

        store_path='{{default "" .STORE_PATH}}'
        if [ -z "$store_path" ]; then
          printf '%s\n' 'task hm.gc.repair-macl: pass STORE_PATH=/nix/store/<path> from the GC error.' >&2
          exit 2
        fi

        case "$store_path" in
          /nix/store/*) ;;
          *)
            printf '%s\n' 'task hm.gc.repair-macl: STORE_PATH must be under /nix/store.' >&2
            exit 2
            ;;
        esac

        if [ ! -e "$store_path" ]; then
          printf '%s\n' "task hm.gc.repair-macl: store path does not exist: $store_path" >&2
          exit 2
        fi

        repo_root='{{.REPO_ROOT}}'
        nix_bin="$("$repo_root/bootstrap/install-nix.sh")"
        nix_bin_dir="$(dirname "$nix_bin")"
        nix_store_bin="$nix_bin_dir/nix-store"
        if [ ! -x "$nix_store_bin" ]; then
          nix_store_bin="$(command -v nix-store)"
        fi

        roots="$(PATH="$nix_bin_dir:$PATH" "$nix_store_bin" --query --roots "$store_path")"
        if [ -n "$roots" ]; then
          printf '%s\n' "task hm.gc.repair-macl: refusing to alter rooted store path: $store_path" >&2
          printf '%s\n' "$roots" >&2
          exit 2
        fi

        if ! xattr -lr "$store_path" 2>/dev/null | grep -q 'com\.apple\.macl:'; then
          printf '%s\n' "task hm.gc.repair-macl: no com.apple.macl metadata found: $store_path"
          exit 0
        fi

        sudo -H xattr -dr com.apple.macl "$store_path"
        printf '%s\n' "task hm.gc.repair-macl: removed com.apple.macl metadata: $store_path"
