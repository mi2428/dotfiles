version: '3'

tasks:
  age.init:
    desc: Generate the repo age identity, recipient metadata, and local chezmoi config
    preconditions:
      - sh: '[ "{{default "0" .FORCE}}" = "1" ] || { [ ! -e "$HOME/.config/chezmoi/key.txt" ] && [ ! -e "{{.REPO_ROOT}}/chezmoi/key.txt.age" ] && [ ! -e "{{.REPO_ROOT}}/chezmoi/.chezmoidata/secrets.yaml" ]; }'
        msg: age state already exists; rerun with FORCE=1 only when you intentionally want to rekey every encrypted bundle
    cmds:
      - |
        set -eu
        chezmoi_source='{{.REPO_ROOT}}/chezmoi'
        chezmoi_config_dir="$HOME/.config/chezmoi"
        chezmoi_config="$chezmoi_config_dir/chezmoi.toml"
        chezmoi_key="$chezmoi_config_dir/key.txt"
        chezmoi_encrypted_key="$chezmoi_source/key.txt.age"
        chezmoi_data_dir="$chezmoi_source/.chezmoidata"
        chezmoi_data_file="$chezmoi_data_dir/secrets.yaml"
        mkdir -p "$chezmoi_config_dir" "$chezmoi_data_dir"
        if [ -f "$chezmoi_config" ] \
          && [ -n "$(tr -d '[:space:]' < "$chezmoi_config")" ] \
          && ! grep -Eq '^# managed by (.*/)?dotfiles/Taskfile\.yml$' "$chezmoi_config"; then
          echo "Refusing to overwrite $chezmoi_config without the dotfiles marker" >&2
          exit 1
        fi
        tmp_key="$(mktemp)"
        trap 'rm -f "$tmp_key"' EXIT
        "{{.CHEZMOI_BIN}}" age-keygen --output "$tmp_key" >/dev/null
        recipient="$("{{.CHEZMOI_BIN}}" age-keygen --convert "$tmp_key" | awk 'NF { print $1; exit }')"
        if [ -z "$recipient" ]; then
          echo "Failed to capture age recipient from chezmoi age-keygen" >&2
          exit 1
        fi
        install -m 600 "$tmp_key" "$chezmoi_key"
        "{{.CHEZMOI_BIN}}" age encrypt --passphrase --output "$chezmoi_encrypted_key" "$tmp_key"
        printf '%s\n' \
          'secrets:' \
          "  ageRecipient: $recipient" \
          > "$chezmoi_data_file"
        printf '%s\n' \
          '# managed by dotfiles/Taskfile.yml' \
          'encryption = "age"' \
          '[age]' \
          "    identity = \"$chezmoi_key\"" \
          "    recipient = \"$recipient\"" \
          > "$chezmoi_config"
        printf 'Initialized age recipient: %s\n' "$recipient"

  age.unlock:
    desc: Decrypt key.txt.age into ~/.config/chezmoi/key.txt and refresh local chezmoi config
    cmds:
      - |
        set -eu
        chezmoi_source='{{.REPO_ROOT}}/chezmoi'
        chezmoi_config_dir="$HOME/.config/chezmoi"
        chezmoi_config="$chezmoi_config_dir/chezmoi.toml"
        chezmoi_key="$chezmoi_config_dir/key.txt"
        chezmoi_encrypted_key="$chezmoi_source/key.txt.age"
        chezmoi_data_file="$chezmoi_source/.chezmoidata/secrets.yaml"
        mkdir -p "$chezmoi_config_dir"
        if [ -f "$chezmoi_config" ] \
          && [ -n "$(tr -d '[:space:]' < "$chezmoi_config")" ] \
          && ! grep -Eq '^# managed by (.*/)?dotfiles/Taskfile\.yml$' "$chezmoi_config"; then
          echo "Refusing to overwrite $chezmoi_config without the dotfiles marker" >&2
          exit 1
        fi
        if [ ! -s "$chezmoi_encrypted_key" ]; then
          echo "Missing $chezmoi_encrypted_key. Run 'task age.init' first." >&2
          exit 1
        fi
        if [ ! -s "$chezmoi_data_file" ]; then
          echo "Missing $chezmoi_data_file. Run 'task age.init' first." >&2
          exit 1
        fi
        "{{.CHEZMOI_BIN}}" age decrypt --output "$chezmoi_key" --passphrase "$chezmoi_encrypted_key"
        chmod 600 "$chezmoi_key"
        recipient="$(awk -F': ' '/ageRecipient:/ { print $2 }' "$chezmoi_data_file" | tail -n 1)"
        if [ -z "$recipient" ]; then
          echo "ageRecipient was empty in $chezmoi_data_file" >&2
          exit 1
        fi
        printf '%s\n' \
          '# managed by dotfiles/Taskfile.yml' \
          'encryption = "age"' \
          '[age]' \
          "    identity = \"$chezmoi_key\"" \
          "    recipient = \"$recipient\"" \
          > "$chezmoi_config"

  secrets.encrypt:
    desc: Encrypt all bundles or a single bundle with BUNDLE=ssh|gnupg|hermes
    preconditions:
      - sh: '[ -z "{{default "" .BUNDLE}}" ] || [ "{{.BUNDLE}}" = "ssh" ] || [ "{{.BUNDLE}}" = "gnupg" ] || [ "{{.BUNDLE}}" = "hermes" ]'
        msg: BUNDLE must be ssh, gnupg, or hermes
    cmds:
      - |
        set -eu
        bundle_input='{{default "" .BUNDLE}}'
        if [ -n "$bundle_input" ]; then
          task secrets.encrypt-bundle BUNDLE="$bundle_input" GPG_KEY_IDS='{{default "" .GPG_KEY_IDS}}'
        else
          for bundle in ssh gnupg hermes; do
            task secrets.encrypt-bundle BUNDLE="$bundle" GPG_KEY_IDS='{{default "" .GPG_KEY_IDS}}'
          done
        fi

  secrets.decrypt:
    desc: Decrypt all bundles or a single bundle with BUNDLE=ssh|gnupg|hermes
    preconditions:
      - sh: '[ -z "{{default "" .BUNDLE}}" ] || [ "{{.BUNDLE}}" = "ssh" ] || [ "{{.BUNDLE}}" = "gnupg" ] || [ "{{.BUNDLE}}" = "hermes" ]'
        msg: BUNDLE must be ssh, gnupg, or hermes
    cmds:
      - |
        set -eu
        bundle_input='{{default "" .BUNDLE}}'
        if [ -n "$bundle_input" ]; then
          task secrets.decrypt-bundle BUNDLE="$bundle_input" IMPORT_GPG='{{default "0" .IMPORT_GPG}}' DECRYPT_HOME='{{default "" .DECRYPT_HOME}}'
        else
          for bundle in ssh gnupg hermes; do
            task secrets.decrypt-bundle BUNDLE="$bundle" IMPORT_GPG='{{default "0" .IMPORT_GPG}}' DECRYPT_HOME='{{default "" .DECRYPT_HOME}}'
          done
        fi

  secrets.backup:
    desc: Backup ssh, gnupg, and Hermes context into encrypted source state
    cmds:
      - task: secrets.encrypt
        vars:
          BUNDLE: '{{default "" .BUNDLE}}'
          GPG_KEY_IDS: '{{default "" .GPG_KEY_IDS}}'

  secrets.clear:
    desc: Remove local staging and decrypted secret work directories
    cmds:
      - |
        set -eu
        cache_dir="${CACHE_DIR:-$HOME/.cache/dotfiles/secrets}"
        rm -rf "$cache_dir"

  assert-age-ready:
    internal: true
    cmds:
      - |
        set -eu
        chezmoi_source='{{.REPO_ROOT}}/chezmoi'
        chezmoi_config_dir="$HOME/.config/chezmoi"
        chezmoi_config="$chezmoi_config_dir/chezmoi.toml"
        chezmoi_key="$chezmoi_config_dir/key.txt"
        chezmoi_encrypted_key="$chezmoi_source/key.txt.age"
        chezmoi_data_file="$chezmoi_source/.chezmoidata/secrets.yaml"
        if [ ! -x "{{.CHEZMOI_BIN}}" ]; then
          echo "chezmoi was not found. bootstrap/install-chezmoi.sh could not resolve it." >&2
          exit 1
        fi
        if [ ! -s "$chezmoi_encrypted_key" ] || [ ! -s "$chezmoi_data_file" ]; then
          echo "Encryption is not initialized. Run 'task age.init' first." >&2
          exit 1
        fi
        if [ ! -s "$chezmoi_key" ] || [ ! -s "$chezmoi_config" ]; then
          echo "Local chezmoi age config is missing. Run 'task age.unlock' first." >&2
          exit 1
        fi

  secrets.encrypt-bundle:
    requires:
      vars:
        - name: BUNDLE
          enum: [ssh, gnupg, hermes]
    preconditions:
      - sh: '{{if eq .BUNDLE "gnupg"}}command -v gpg >/dev/null 2>&1{{else}}true{{end}}'
        msg: gpg is required for BUNDLE=gnupg
    cmds:
      - task: assert-age-ready
      - |
        set -eu
        bundle='{{.BUNDLE}}'
        repo_root='{{.REPO_ROOT}}'
        chezmoi_source='{{.REPO_ROOT}}/chezmoi'
        chezmoi_data_file="$chezmoi_source/.chezmoidata/secrets.yaml"
        cache_dir="${CACHE_DIR:-$HOME/.cache/dotfiles/secrets}"
        stage_home="$cache_dir/stage-home"
        archive_dir="$repo_root/secrets"
        archive_plain="$cache_dir/$bundle.tar"
        gpg_export_root='.local/share/dotfiles/gnupg'
        age_root="$(nix build --no-link --print-out-paths nixpkgs#age)"
        age_bin="$age_root/bin/age"
        if [ ! -x "$age_bin" ]; then
          echo "Failed to resolve age from nixpkgs#age" >&2
          exit 1
        fi
        recipient="$(awk -F': ' '/ageRecipient:/ { print $2 }' "$chezmoi_data_file" | tail -n 1)"
        if [ -z "$recipient" ]; then
          echo "ageRecipient was empty in $chezmoi_data_file" >&2
          exit 1
        fi
        rm -rf "$stage_home"
        rm -f "$archive_plain"
        mkdir -p "$stage_home" "$archive_dir"
        cleanup_hermes() {
          if [ "$bundle" = "hermes" ]; then
            rm -rf "$stage_home"
            rm -f "$archive_plain"
          fi
        }
        trap cleanup_hermes EXIT
        case "$bundle" in
          ssh)
            src="$HOME/.ssh"
            dst="$stage_home/.ssh"
            encrypted_archive="$archive_dir/ssh.tar.age"
            if [ ! -d "$src" ]; then
              echo "Missing $src" >&2
              exit 1
            fi
            # Back up the managed SSH tree by default and exclude only
            # connection-local caches and trust databases that are cheap to rebuild.
            find "$src" -type f \
              ! -name 'known_hosts*' \
              -print | while IFS= read -r file; do
                relpath="${file#$src/}"
                install -Dm600 "$file" "$dst/$relpath"
              done
            tar -C "$stage_home" -cf "$archive_plain" .ssh
            rm -rf "$chezmoi_source/dot_ssh"
            ;;
          gnupg)
            src_gnupg="${GNUPGHOME:-$HOME/.gnupg}"
            dst_gnupg="$stage_home/.gnupg"
            export_root="$stage_home/$gpg_export_root"
            gpg_key_ids='{{default "" .GPG_KEY_IDS}}'
            encrypted_archive="$archive_dir/gnupg.tar.age"
            mkdir -p "$dst_gnupg" "$export_root"
            for file in gpg.conf gpg-agent.conf dirmngr.conf scdaemon.conf sshcontrol; do
              if [ -f "$src_gnupg/$file" ]; then
                install -m 600 "$src_gnupg/$file" "$dst_gnupg/$file"
              fi
            done
            if [ -d "$src_gnupg/openpgp-revocs.d" ]; then
              find "$src_gnupg/openpgp-revocs.d" -type f -name '*.rev' -print | while IFS= read -r file; do
                install -Dm600 "$file" "$dst_gnupg/openpgp-revocs.d/$(basename "$file")"
              done
            fi
            export_args=""
            if [ -n "$gpg_key_ids" ]; then
              export_args="$gpg_key_ids"
            fi
            GNUPGHOME="$src_gnupg" gpg --batch --yes --armor --export $export_args > "$export_root/public.asc"
            GNUPGHOME="$src_gnupg" gpg --batch --yes --armor --export-secret-keys $export_args > "$export_root/secret.asc"
            GNUPGHOME="$src_gnupg" gpg --export-ownertrust > "$export_root/ownertrust.txt"
            chmod 600 "$export_root/"*
            tar -C "$stage_home" -cf "$archive_plain" .gnupg "$gpg_export_root"
            rm -rf \
              "$chezmoi_source/dot_local/share/dotfiles/gnupg" \
              "$chezmoi_source/private_dot_gnupg"
            ;;
          hermes)
            src_hermes="$HOME/.hermes"
            dst_hermes="$stage_home/.hermes"
            encrypted_archive="$archive_dir/hermes-context.tar.age"
            staged=0
            # Skills, sessions, databases, and credentials are intentionally excluded.
            for relpath in SOUL.md memories/MEMORY.md memories/USER.md; do
              if [ -f "$src_hermes/$relpath" ]; then
                mkdir -p "$(dirname "$dst_hermes/$relpath")"
                install -m 600 "$src_hermes/$relpath" "$dst_hermes/$relpath"
                staged=$((staged + 1))
              fi
            done
            if [ "$staged" -eq 0 ]; then
              echo "No Hermes context files found under $src_hermes" >&2
              exit 1
            fi
            tar -C "$stage_home" -cf "$archive_plain" .hermes
            ;;
        esac
        if [ ! -s "$archive_plain" ]; then
          echo "No files were staged for $bundle" >&2
          exit 1
        fi
        # Bundle secrets into a single encrypted blob so repo-visible paths do
        # not leak the original secret file names or directory layout.
        "$age_bin" --recipient "$recipient" --output "$encrypted_archive" "$archive_plain"

  secrets.decrypt-bundle:
    requires:
      vars:
        - name: BUNDLE
          enum: [ssh, gnupg, hermes]
    preconditions:
      - sh: '{{if and (eq .BUNDLE "gnupg") (eq (default "0" .IMPORT_GPG) "1")}}command -v gpg >/dev/null 2>&1{{else}}true{{end}}'
        msg: gpg is required for IMPORT_GPG=1 with BUNDLE=gnupg
    cmds:
      - task: assert-age-ready
      - |
        set -eu
        bundle='{{.BUNDLE}}'
        repo_root='{{.REPO_ROOT}}'
        chezmoi_key="$HOME/.config/chezmoi/key.txt"
        decrypt_home='{{default "" .DECRYPT_HOME}}'
        import_gpg='{{default "0" .IMPORT_GPG}}'
        cache_dir="${CACHE_DIR:-$HOME/.cache/dotfiles/secrets}"
        archive_plain="$cache_dir/$bundle.tar"
        gpg_export_root='.local/share/dotfiles/gnupg'
        cleanup_hermes_archive() {
          if [ "$bundle" = "hermes" ]; then
            rm -f "$archive_plain"
          fi
        }
        trap cleanup_hermes_archive EXIT
        age_root="$(nix build --no-link --print-out-paths nixpkgs#age)"
        age_bin="$age_root/bin/age"
        if [ ! -x "$age_bin" ]; then
          echo "Failed to resolve age from nixpkgs#age" >&2
          exit 1
        fi
        if [ -z "$decrypt_home" ]; then
          decrypt_home="$HOME/.cache/dotfiles/secrets/decrypted-home"
        fi
        mkdir -p "$decrypt_home" "$cache_dir"
        case "$bundle" in
          ssh)
            encrypted_archive="$repo_root/secrets/ssh.tar.age"
            ;;
          gnupg)
            encrypted_archive="$repo_root/secrets/gnupg.tar.age"
            ;;
          hermes)
            encrypted_archive="$repo_root/secrets/hermes-context.tar.age"
            ;;
        esac
        if [ ! -s "$encrypted_archive" ]; then
          echo "Missing $encrypted_archive. Run 'task secrets.backup BUNDLE=$bundle' first." >&2
          exit 1
        fi
        rm -f "$archive_plain"
        "$age_bin" --decrypt --identity "$chezmoi_key" --output "$archive_plain" "$encrypted_archive"
        tar -C "$decrypt_home" -xf "$archive_plain"
        if [ "$bundle" = "gnupg" ] && [ "$import_gpg" = "1" ]; then
          export_dir="$decrypt_home/$gpg_export_root"
          gnupghome="$decrypt_home/.gnupg"
          mkdir -p "$gnupghome"
          chmod 700 "$gnupghome"
          if [ -f "$export_dir/public.asc" ]; then
            GNUPGHOME="$gnupghome" gpg --batch --yes --import "$export_dir/public.asc"
          fi
          if [ -f "$export_dir/secret.asc" ]; then
            GNUPGHOME="$gnupghome" gpg --batch --yes --pinentry-mode loopback --import "$export_dir/secret.asc" || \
              GNUPGHOME="$gnupghome" gpg --batch --yes --import "$export_dir/secret.asc"
          fi
          if [ -f "$export_dir/ownertrust.txt" ]; then
            GNUPGHOME="$gnupghome" gpg --import-ownertrust "$export_dir/ownertrust.txt"
          fi
        fi
