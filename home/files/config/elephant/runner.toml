generic_text = 'run: '
history = true
history_when_empty = false

[Config]
hide_from_providerlist = false
icon = 'utilities-terminal'
min_score = 50
name_pretty = ''

# Curated commands shown in walker without the ">" runner prefix.
# Any other command still runs through the ">" prefix.
[[explicits]]
exec = 'omarchy-toggle-nightlight'
alias = 'Toggle Nightlight'

[[explicits]]
exec = 'omarchy-toggle-notification-silencing'
alias = 'Toggle Notifications (DND)'

[[explicits]]
exec = 'omarchy-toggle-bar'
alias = 'Toggle Bar'

[[explicits]]
