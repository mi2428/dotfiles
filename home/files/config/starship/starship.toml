"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 750
scan_timeout = 50

# Catppuccin flavour selection. Uncomment exactly one line.
# palette = "catppuccin_latte"
# palette = "catppuccin_frappe"
# palette = "catppuccin_macchiato"
palette = "catppuccin_mocha"

# IMPORTANT: Starship ships built-in git_metrics and git_status modules, but
# they perform poorly in very large repositories.
# We intentionally keep the prompt visuals while replacing the expensive pieces
# with custom implementations, so future changes should not "simplify" this
# back to the stock modules without re-checking performance.
format = """
$directory\
$python\
$git_branch\
${custom.git_state}\
$aws\
$hostname\
$cmd_duration\
$line_break\
$character"""
right_format = """$status$jobs$time$battery"""

[directory]
format = "[$path]($style)"
style = "bold lavender"
truncate_to_repo = false
truncation_length = 0
fish_style_pwd_dir_length = 0
read_only = ""

[git_branch]
format = "[ $symbol$branch]($style)"
style = "bold mauve"
symbol = " "

[git_status]
disabled = true
format = "[ $all_status$ahead_behind]($style)"
style = "bold peach"
conflicted = "*"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "*"
stashed = "≡"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"
typechanged = "*"
ignore_submodules = true

[git_metrics]
disabled = true

# Git prompt performance notes (benchmarked on 2026-07-19):
#
# This configuration deliberately bypasses Starship only for the expensive
# git-status/git-metrics collection path. Starship still owns prompt layout,
# directory rendering, git_branch, colors, and every unrelated module. In
# particular, git_branch remains live and uncached, so checkouts and detached
# HEAD changes are reflected immediately.
#
# Before this split, a warm prompt took about 84 ms in both ~/dotfiles and
# ~/io/hubble2. Starship reported roughly 77 ms for custom.git_state alone:
# about 14.5 ms for its command-based `when` probe and 56-57 ms for the
# Bash-to-Python cached helper. The underlying Git operations were much cheaper
# (roughly 10-26 ms), so repository size was not the primary foreground
# bottleneck; process startup was. The Bash hot path below reduced a warm full
# prompt to about 15-18 ms in both repositories. With the one-second TTL, an
# isolated stale-cache prompt that also launches a refresh takes about 35-40 ms.
# The detached refresh itself takes about 78 ms in dirty ~/dotfiles and 81 ms in
# clean ~/io/hubble2; that work continues after prompt rendering returns.
#
# `when = true` is intentional. A command-based `when` would synchronously
# launch Git before every prompt. Instead, the sourced Bash helper performs a
# built-in-only cache read and maintains a short-lived negative cache outside
# Git repositories. Python and Git run only in the detached refresh path.
[custom.git_state]
command = 'source "${XDG_CONFIG_HOME:-$HOME/.config}/starship/git-metrics.sh" summary'
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "$output"
unsafe_no_escape = true

[cmd_duration]
min_time = 5000
format = "[ $duration]($style)"
style = "bold yellow"
show_milliseconds = false

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "󰅚 "
style = "bold red"
map_symbol = true
recognize_signal_code = true

[jobs]
symbol = "✦ "
style = "bold sky"
number_threshold = 1
symbol_threshold = 1

[time]
disabled = false
format = "[$time]($style) "
style = "bold overlay1"
time_format = "%H:%M"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 30
style = "bold red"

[[battery.display]]
threshold = 70
style = "bold yellow"

[[battery.display]]
style = "bold green"

[line_break]
disabled = false

[character]
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰅚](red) ❯](peach)"
vimcmd_symbol = "[󰄛 ❮](subtext1)"

[python]
format = "[ $symbol $virtualenv]($style)"
style = "bold sapphire"
symbol = ""
detect_extensions = []
detect_files = []
detect_folders = []
python_binary = "python3"

[aws]
format = "[$symbol$profile]($style) "
style = "bold yellow"
symbol = "󰸏 "

[kubernetes]
disabled = true

[container]
disabled = true

[hostname]
ssh_only = true
format = "[ $hostname]($style)"
style = "bold teal"
trim_at = "."

[username]
disabled = true

