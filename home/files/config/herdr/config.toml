onboarding = false
[terminal]
# Honor the user's configured shell instead of hardcoding a Homebrew path.
default_shell = ""
shell_mode = "login"

[keys]
prefix = "ctrl+t"

# Carry over the tmux muscle memory from etc/tmux/tmux.conf.
detach = "prefix+d"
new_tab = "prefix+c"
goto = ""
toggle_sidebar = "prefix+b"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"

[[keys.command]]
key = "prefix+g"
type = "popup"
# Launch through fish so lazygit always inherits the Catppuccin merge config,
# even when the herdr server was started from a stale outer environment. Append
# the popup-only override so the regular lazygit command remains side-by-side.
command = "if command -v fish >/dev/null 2>&1; then exec fish -lc 'set -lx LG_CONFIG_FILE \"$LG_CONFIG_FILE,$HOME/.config/herdr/lazygit-unified.yml\"; exec lazygit'; else exec env LG_CONFIG_FILE=\"${LG_CONFIG_FILE:+$LG_CONFIG_FILE,}$HOME/.config/herdr/lazygit-unified.yml\" lazygit; fi"
description = "run lazygit"
width = "90%"
height = "90%"

[theme]
# Prefer Herdr's built-in Catppuccin theme so pane accents don't depend on
# the host terminal's ANSI palette.
# name = "terminal"
# name = "catppuccin-latte"
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[theme.custom]
panel_bg = "reset"
accent = "#cba6f7"
# Sidebar row/background styling uses the surface tokens.
# Keep the overall active emphasis aligned with tmux's mauve chip while the
# background stays on Catppuccin's darker surface shades.
surface0 = "#45475a"
surface_dim = "#313244"
subtext0 = "#bac2de"
text = "#bac2de"
mauve = "#cba6f7"

[ui]
host_cursor = "native"
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = false
hide_tab_bar_when_single_tab = true
agent_panel_sort = "spaces"
# Name workspaces up front so agent groups stay identifiable in the sidebar.
prompt_new_workspace_name = true
