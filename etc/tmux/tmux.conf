set -g prefix C-t

# note: "screen-256color" may not render truecolor cleanly with this setup.
set -g default-terminal "xterm-256color"
#set -g default-terminal "screen-256color"
#set -g terminal-overrides "xterm:colors=256"

set -g base-index 1
set -qg history-limit 10000000
set -sg escape-time 0
set -g focus-events on
set -sa terminal-overrides ",*256col*:RGB:Ss=\\E[%p1%d q:Se=\\E[1 q"

# Catppuccin flavour selection. Uncomment exactly one line.
# set -g @theme "catppuccin-latte"
# set -g @theme "catppuccin-frappe"
# set -g @theme "catppuccin-macchiato"
set -g @theme "catppuccin-mocha"

if -F '#{==:#{@theme},catppuccin-latte}' "set -g @catppuccin_flavor latte"
if -F '#{==:#{@theme},catppuccin-frappe}' "set -g @catppuccin_flavor frappe"
if -F '#{==:#{@theme},catppuccin-macchiato}' "set -g @catppuccin_flavor macchiato"
if -F '#{==:#{@theme},catppuccin-mocha}' "set -g @catppuccin_flavor mocha"

set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_current_left_separator ""
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_current_middle_separator ""
set -g @dotfiles_window_right_separator '#[fg=#{E:@catppuccin_window_number_color},bg=#{E:@catppuccin_window_text_color}]#[none]'
set -g @dotfiles_window_current_right_separator '#[fg=#{E:@catppuccin_window_current_number_color},bg=#{E:@catppuccin_window_current_text_color}]#[none]'
set -g @dotfiles_window_end_right_separator '#[fg=#{E:@catppuccin_window_number_color},bg=#{E:@_ctp_status_bg}]#[none]'
set -g @dotfiles_window_current_end_right_separator '#[fg=#{E:@catppuccin_window_current_number_color},bg=#{E:@_ctp_status_bg}]#[none]'
set -g @catppuccin_window_right_separator '##{?window_end_flag,##{E:@dotfiles_window_end_right_separator},##{E:@dotfiles_window_right_separator}}'
set -g @catppuccin_window_current_right_separator '##{?window_end_flag,##{E:@dotfiles_window_current_end_right_separator},##{E:@dotfiles_window_current_right_separator}}'
set -g @catppuccin_window_text ' #($HOME/.tmux/scripts/window-label.sh "#{pane_current_command}" "#{pane_current_path}" "#{default-shell}")'
set -g @catppuccin_window_current_text ' #($HOME/.tmux/scripts/window-label.sh "#{pane_current_command}" "#{pane_current_path}" "#{default-shell}")'
set -g window-status-separator ""
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_default_text "##{pane_current_command}"
set -g pane-border-status bottom

if-shell '[ -f "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" ]' "run-shell '$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'"

## https://stackoverflow.com/questions/32374907/tmux-mouse-copy-mode-jumps-to-bottom
set -g mouse on
bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys Up } { copy-mode -e } }
bind -n WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys Down } { } }
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X clear-selection

bind -n C-g send-prefix
bind -n C-b send-prefix \; send-prefix

bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind _ split-window -v -c "#{pane_current_path}" \; select-layout even-vertical

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r Z resize-pane -Z

bind t display-panes
bind q confirm-before kill-pane
bind Q confirm-before kill-window

bind a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
bind r source-file $HOME/.tmux.conf\; display "configuration reloaded"
unbind R

source-file $HOME/.tmux/statusbar.conf
