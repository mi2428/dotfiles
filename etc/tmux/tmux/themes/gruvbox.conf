# vim: ft=tmux
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#b8bb26"
set -g pane-border-format "#{?pane_active,#[bold,fg=#ebdbb2],#[fg=#a89984]}#{pane_index}:#{pane_current_command}#[default]"
set -g copy-mode-match-style "fg=#1d2021,bg=#b57614"
set -g copy-mode-current-match-style "fg=#1d2021,bg=#d79921"
set -g mode-style "fg=#1d2021,bg=#d79921"
set -g message-style "fg=#ebdbb2,bg=#3c3836"
set -g message-command-style "fg=#1d2021,bg=#83a598"
