# vim: ft=tmux
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"
set -g pane-border-format "#{?pane_active,#[bold,fg=#4c4f69],#[fg=#8c8fa1]}#{pane_index}:#{pane_current_command}#[default]"
set -g copy-mode-match-style "fg=#eff1f5,bg=#fe640b"
set -g copy-mode-current-match-style "fg=#eff1f5,bg=#df8e1d"
set -g mode-style "fg=#eff1f5,bg=#df8e1d"
set -g message-style "fg=#4c4f69,bg=#e6e9ef"
set -g message-command-style "fg=#eff1f5,bg=#1e66f5"
