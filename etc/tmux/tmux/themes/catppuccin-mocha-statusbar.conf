# vim: ft=tmux
bar="#[default,fg=#6c7086]|#[default]"
hostname="#[bold,fg=#cdd6f4]#H#[default]"
session="#[bold,fg=#89b4fa]#S#[default]"
cpu="#($HOME/.tmux/scripts/cpu.sh)"
mem="#($HOME/.tmux/scripts/mem.sh)"
user="#($HOME/.tmux/scripts/user.sh)"
ipv4="#($HOME/.tmux/scripts/ipv4.sh)"
ipv6="#($HOME/.tmux/scripts/ipv6.sh)"

set -g status-position bottom
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-bg "#181825"
set -g status-fg "#cdd6f4"
set -g status-left-length 40
set -g status-right-length 140
set -g status-left " [$session] "
set -g status-right "$bar C: $cpu $bar M: $mem $bar U: $user $bar I: $ipv4, $ipv6 $bar $hostname $bar %Y-%m-%d %H:%M:%S"
set -wg window-status-format "#[fg=#7f849c] #I:#W #[default]$bar"
set -wg window-status-current-format "#[bold,fg=#1e1e2e,bg=#89b4fa] #I:#W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} #[default]$bar"
