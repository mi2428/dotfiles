# vim: ft=tmux
set -g pane-border-style "fg=#4d6a57"
set -g pane-active-border-style "fg=#6fa87f"
set -g pane-border-format "#{?pane_active,#[bold,fg=#eaf5ee],#[fg=#97a99c]}#{pane_index}:#{pane_current_command}#[default]"
set -g copy-mode-match-style "fg=#111111,bg=#d9b84f"
set -g copy-mode-current-match-style "fg=#111111,bg=#ffd75f"
set -g mode-style "fg=#111111,bg=#ffd75f"
set -g message-style "fg=#dfe9e2,bg=#223129"
set -g message-command-style "fg=#111111,bg=#78a38b"
