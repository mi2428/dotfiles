# vim: ft=tmux
bar="#[default,fg=#56675a]|#[default]"
cpu="#($HOME/.tmux/scripts/cpu.sh)"
mem="#($HOME/.tmux/scripts/mem.sh)"
ssd="#($HOME/.tmux/scripts/ssd.sh)"
ipv4="#($HOME/.tmux/scripts/ipv4.sh)"
ipv6="#($HOME/.tmux/scripts/ipv6.sh)"

set -g status-position bottom
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-bg "#16211b"
set -g status-fg "#bcc9c0"
set -g status-left-length 40
set -g status-right-length 140
set -g status-left "[#S] "
set -g status-right "$bar   $cpu $bar   $mem $bar  $ssd $bar  $ipv4, $ipv6 $bar 󰌢  #H $bar   %Y-%m-%d %H:%M:%S"
set -wg window-status-format "#[fg=#8d9d92]#I:#W $bar"
set -wg window-status-current-format "#[bold,fg=#eef5ef]#I:#W*#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} $bar"
