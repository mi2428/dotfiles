gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 4
  shrinkSidePanelsToContent: true
  showBottomLine: false
  sidePanels:
    - [files, worktrees, submodules]
    - [commits, reflog, stash]
    - [branches, remotes, tags]
  mainPanelSplitMode: flexible
  enlargedSideViewLocation: left
  wrapLinesInStagingView: true
  useHunkModeInStagingView: true
  filterMode: fuzzy
  branchColorPatterns:
    "^main$": green
    "^master$": green
    "^release/": yellow
    "^hotfix/": red
    "^docs/": cyan
    "^chore/": blue
  theme:
    activeBorderColor:
      - "#89B4FA"
    inactiveBorderColor:
      - "#7F849C"
    searchingActiveBorderColor:
      - "#89DCEB"
    optionsTextColor:
      - "#F9E2AF"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#181825"
    cherryPickedCommitFgColor:
      - "#A6E3A1"
    cherryPickedCommitBgColor:
      - "#313244"
    markedBaseCommitFgColor:
      - "#1E1E2E"
    markedBaseCommitBgColor:
      - "#CBA6F7"
    unstagedChangesColor:
      - "#F38BA8"
    defaultFgColor:
      - "#CDD6F4"

git:
  pagers:
    - name: delta
      pager: 'delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" --side-by-side --syntax-theme="Catppuccin Mocha"'
    - {}
  autoForwardBranches: onlyMainBranches

os:
  shellFunctionsFile: ~/.config/lazygit/functions.sh

disableStartupPopups: true

customCommands:
  - key: "C"
    context: "files"
    description: "Create a conventional commit"
    prompts:
      - type: "menu"
        title: "Select the commit type"
        key: "Type"
        options:
          - value: "feat"
          - value: "fix"
          - value: "chore"
          - value: "docs"
          - value: "refactor"
          - value: "test"
          - value: "ci"
          - value: "build"
          - value: "perf"
      - type: "input"
        title: "Scope (optional)"
        key: "Scope"
        initialValue: ""
      - type: "input"
        title: "Description"
        key: "Description"
        initialValue: ""
    command: "TYPE={{.Form.Type | quote}} SCOPE={{.Form.Scope | quote}} DESC={{.Form.Description | quote}} sh -c 'if [ -n \"$SCOPE\" ]; then git commit -m \"$TYPE($SCOPE): $DESC\"; else git commit -m \"$TYPE: $DESC\"; fi'"
    output: "terminal"
  - key: "<c-o>"
    context: "global"
    description: "Open repository on GitHub"
    command: "lg_open_repo"
    output: "none"
