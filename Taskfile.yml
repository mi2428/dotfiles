version: '3'

silent: true

vars:
  REPO_ROOT:
    sh: pwd
  CHEZMOI_BIN:
    sh: ./bootstrap/install-chezmoi.sh

includes:
  brew:
    taskfile: ./taskfiles/brew.yml
    flatten: true
    vars:
      REPO_ROOT:
        ref: .REPO_ROOT
  hm:
    taskfile: ./taskfiles/hm.yml
    flatten: true
    vars:
      REPO_ROOT:
        ref: .REPO_ROOT
  secrets:
    taskfile: ./taskfiles/secrets.yml
    flatten: true
    vars:
      REPO_ROOT:
        ref: .REPO_ROOT
      CHEZMOI_BIN:
        ref: .CHEZMOI_BIN
  docker:
    taskfile: ./taskfiles/docker.yml
    flatten: true

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Show this help message
    internal: true
    cmds:
      - |
        bold='\033[1m'
        cyan='\033[36m'
        green='\033[32m'
        yellow='\033[33m'
        dim='\033[2m'
        reset='\033[0m'
        task_fmt='  %b%-18s%b %s\n'
        default_fmt='  %b%-18s%b %s\n'
        printf '%bTasks%b\n' "$bold$cyan" "$reset"
        printf "$task_fmt" "$green" 'hm.build' "$reset" 'Build the current host activation without switching'
        printf "$task_fmt" "$green" 'hm.switch' "$reset" 'Apply the current host activation and refresh managed symlinks'
        printf "$task_fmt" "$green" 'hm.link' "$reset" 'Re-apply the current host activation to re-create managed symlinks'
        printf "$task_fmt" "$green" 'hm.update' "$reset" 'Update nixpkgs in flake.lock and apply the current host activation'
        printf "$task_fmt" "$green" 'hm.gc' "$reset" 'Delete old generations and collect Nix garbage (run without sudo)'
        printf "$task_fmt" "$green" 'brew.check' "$reset" 'Check the repo-managed Brewfile against the local Homebrew state'
        printf "$task_fmt" "$green" 'brew.sync' "$reset" 'Update and upgrade Homebrew, then apply the repo-managed Brewfile'
        printf "$task_fmt" "$green" 'secrets.encrypt' "$reset" 'Encrypt ssh and/or gnupg into chezmoi source state'
        printf "$task_fmt" "$green" 'secrets.decrypt' "$reset" 'Decrypt ssh and/or gnupg into a target directory'
        printf "$task_fmt" "$green" 'secrets.backup' "$reset" 'Backup ssh and gnupg into encrypted chezmoi source state'
        printf "$task_fmt" "$green" 'secrets.clear' "$reset" 'Remove local staging and decrypted secret work directories'
        printf "$task_fmt" "$green" 'docker.build' "$reset" 'Build Dockerfile locally as ghcr.io/OWNER/IMAGE:TAG'
        printf "$task_fmt" "$green" 'docker.login' "$reset" 'Login to ghcr.io with GHCR_TOKEN, GITHUB_TOKEN, or gh auth token'
        printf "$task_fmt" "$green" 'docker.push' "$reset" 'Build and push Dockerfile to ghcr.io as ghcr.io/OWNER/IMAGE:TAG'
        printf '\n%bDefaults%b\n' "$bold$cyan" "$reset"
        printf "$default_fmt" "$yellow" 'GHCR_OWNER' "$reset" 'mi2428'
        printf "$default_fmt" "$yellow" 'GHCR_IMAGE_NAME' "$reset" 'dotfiles'
        printf "$default_fmt" "$yellow" 'TAG' "$reset" 'latest'
        printf "$default_fmt" "$yellow" 'DOCKER_RUNTIME' "$reset" 'docker'
        printf "$default_fmt" "$yellow" 'PLATFORMS' "$reset" 'linux/amd64,linux/arm64'
        printf "$default_fmt" "$yellow" 'HOST' "$reset" 'auto-detected from the current machine'
        printf "$default_fmt" "$yellow" 'IMPORT_GPG' "$reset" '0'
        printf "$default_fmt" "$yellow" 'DECRYPT_HOME' "$reset" '$HOME/.cache/dotfiles/secrets/decrypted-home'
        printf '\n%bExamples%b\n' "$bold$cyan" "$reset"
        printf '  %btask hm.update HOST=macos%b\n' "$green" "$reset"
        printf '  %btask hm.switch HOST=docker%b\n' "$green" "$reset"
        printf '  %btask hm.gc%b\n' "$green" "$reset"
        printf '  %btask secrets.encrypt%b\n' "$green" "$reset"
        printf '  %btask secrets.encrypt BUNDLE=ssh%b\n' "$green" "$reset"
        printf "  %btask secrets.encrypt BUNDLE=gnupg GPG_KEY_IDS='E8D3009C6341BDEAF038009685AB6867E2147DDA'%b\n" "$green" "$reset"
        printf '  %btask secrets.decrypt IMPORT_GPG=1 DECRYPT_HOME=$HOME%b\n' "$green" "$reset"
        printf '  %btask secrets.backup%b\n' "$green" "$reset"
        printf '  %btask docker.build TAG=latest%b\n' "$green" "$reset"
        printf '  %btask docker.push TAG=latest%b\n' "$green" "$reset"
